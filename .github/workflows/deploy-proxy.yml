name: Deploy CORS Proxy

on:
  push:
    branches: [main]
    paths:
      - 'proxy/**'
      - '.github/workflows/deploy-proxy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check secrets
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          echo "CF_API_TOKEN length: ${#CF_API_TOKEN}"
          echo "CF_ACCOUNT_ID length: ${#CF_ACCOUNT_ID}"
          echo "MINIMAX_API_KEY length: ${#MINIMAX_API_KEY}"
          MISSING=0
          [ "${#CF_API_TOKEN}" -lt 20 ] && { echo "❌ CF_API_TOKEN falta"; MISSING=1; }
          [ "${#CF_ACCOUNT_ID}" -lt 20 ] && { echo "❌ CF_ACCOUNT_ID falta"; MISSING=1; }
          [ "${#MINIMAX_API_KEY}" -lt 10 ] && { echo "❌ MINIMAX_API_KEY falta"; MISSING=1; }
          [ $MISSING -eq 1 ] && exit 1
          echo "✅ Los 3 secrets están"

      - name: Deploy worker script to Cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "→ Subiendo proxy/worker.js a Cloudflare Workers…"
          HTTP_CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/menuapp-minimax-proxy" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/javascript" \
            --data-binary @proxy/worker.js)
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/resp.json | head -c 600
          echo ""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Deploy del script falló (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✅ Script deployado"

      - name: Push MiniMax key as Worker secret
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          echo "→ Subiendo secret MINIMAX_API_KEY al Worker…"
          HTTP_CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/menuapp-minimax-proxy/secrets/MINIMAX_API_KEY" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"secret_text\",\"value\":\"${MINIMAX_API_KEY}\"}")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/resp.json | head -c 600
          echo ""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Subida del secret falló (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✅ Secret configurado"

      - name: Listo
        if: success()
        run: |
          echo ""
          echo "🎉 Worker + secret deployados."
          echo ""
          echo "En la app:"
          echo "  Ajustes → 🤖 Agente IA → Proveedor: Personalizado"
          echo "  Endpoint: https://menuapp-minimax-proxy.workers.dev"
          echo "  Modelo: MiniMax M3"
          echo "  API Key: (dejala vacía — el Worker la tiene)"
