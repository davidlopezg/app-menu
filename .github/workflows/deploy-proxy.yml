name: Deploy CORS Proxy

on:
  push:
    branches: [main]
    paths:
      - 'proxy/**'
      - '.github/workflows/deploy-proxy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check secrets
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "CF_API_TOKEN length: ${#CF_API_TOKEN}"
          echo "CF_ACCOUNT_ID length: ${#CF_ACCOUNT_ID}"
          if [ "${#CF_API_TOKEN}" -lt 20 ]; then
            echo "❌ CF_API_TOKEN está vacío o muy corto. Agregalo en Settings → Secrets."
            exit 1
          fi
          if [ "${#CF_ACCOUNT_ID}" -lt 20 ]; then
            echo "❌ CF_ACCOUNT_ID está vacío o muy corto. Agregalo en Settings → Secrets."
            exit 1
          fi
          echo "✅ Secrets OK"

      - name: Deploy worker to Cloudflare via API
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "→ Subiendo proxy/worker.js a Cloudflare Workers…"
          echo "  Account: ${CF_ACCOUNT_ID}"
          echo "  Script:  menuapp-minimax-proxy"
          echo ""

          # Capturar stdout, stderr y exit code
          set +e
          HTTP_CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/menuapp-minimax-proxy" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/javascript" \
            --data-binary @proxy/worker.js)
          CURL_EXIT=$?
          set -e

          echo "HTTP status: $HTTP_CODE"
          echo "curl exit:   $CURL_EXIT"
          echo "Response body:"
          cat /tmp/resp.json 2>/dev/null | head -c 1000 || echo "(vacío)"
          echo ""

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "❌ curl falló (exit $CURL_EXIT). Probable problema de red."
            exit 1
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Cloudflare devolvió HTTP $HTTP_CODE."
            echo "Causas comunes:"
            echo "  401: token inválido"
            echo "  403: token sin permiso 'Workers Scripts: Edit'"
            echo "  404: account_id incorrecto"
            exit 1
          fi

          echo ""
          echo "✅ Worker desplegado."
          echo ""
          echo "Configurá en la app:"
          echo "  Ajustes → 🤖 Agente IA → Proveedor: Personalizado"
          echo "  Endpoint: https://menuapp-minimax-proxy.workers.dev"
          echo "  Modelo: MiniMax M3"
