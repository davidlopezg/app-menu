name: Deploy CORS Proxy

on:
  push:
    branches: [main]
    paths:
      - 'proxy/**'
      - '.github/workflows/deploy-proxy.yml'
  workflow_dispatch:    # botón "Run workflow" para deployar manualmente

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy worker to Cloudflare via API
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -e

          echo "→ Subiendo proxy/worker.js a Cloudflare Workers…"

          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/menuapp-minimax-proxy" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/javascript" \
            --data-binary @proxy/worker.js)

          HTTP_CODE=$(echo "$RESPONSE" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed 's/HTTP_STATUS:[0-9]*$//')

          echo ""
          echo "HTTP status: $HTTP_CODE"
          echo "Response:"
          echo "$BODY" | head -c 800
          echo ""

          if [ "$HTTP_CODE" = "200" ]; then
            echo ""
            echo "✅ Worker desplegado."
            echo ""
            echo "Configurá en la app:"
            echo "  Ajustes → 🤖 Agente IA → Proveedor: Personalizado"
            echo "  Endpoint: https://menuapp-minimax-proxy.workers.dev"
            echo "  Modelo: MiniMax M3"
          else
            echo ""
            echo "❌ Deploy falló. Revisá:"
            echo "  - CF_API_TOKEN tiene permiso 'Workers Scripts: Edit'"
            echo "  - CF_ACCOUNT_ID es correcto (32 chars hex)"
            exit 1
          fi
